<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Chrome 154+ bundles its own fontconfig (cache-12) and replaces the
     system cache-9 files in ~/.cache/fontconfig with symlinks, which crashes
     KDE/Qt apps. Give Chrome its own writable cache dir. -->
<fontconfig>
  <cachedir prefix="xdg">fontconfig-chrome</cachedir>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
</fontconfig>
